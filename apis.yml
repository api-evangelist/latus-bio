aid: latus-bio
name: Latus Bio
description: 'Latus Bio is a clinical-stage gene therapy company engineering novel
  adeno-associated virus (AAV) capsids to deliver genetic medicines to precise cell
  types in the central nervous system and peripheral tissues. The company screens tens
  of millions of novel capsid variants to build a proprietary database of tissue-targeting
  "delivery zip codes," pairing engineered capsids with optimized routes of administration
  so therapeutics reach the intended tissue at a fraction of conventional doses and
  with minimal off-tissue biodistribution. Its lead programs are LTS-201 for Huntington''s
  disease (AAV.DB-3 capsid) and LTS-101 for CLN2 disease, spanning CNS and ocular
  delivery (AAV.Ep+ capsid). Latus Bio operates offices and laboratories in Philadelphia,
  Pennsylvania and in Boston''s Seaport district, and is backed by DCVC Bio, 8VC,
  BioAdvance, Samsung Venture Investment, and KDB. Latus Bio is catalogued in the API
  Evangelist network as a life-sciences company; it publishes no public developer
  platform, API, or SDK surface at this time.'
